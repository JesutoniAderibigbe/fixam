name: fixam
description: "FixAm: a hostel maintenance agent. Workshop app for 'Beyond Chatbots: Building AI Agents in Flutter with Gemini, Firebase & MCP'."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  # Gemini through Firebase AI Logic. No API key ships in the app.
  firebase_ai: ^3.0.0
  firebase_app_check: ^0.4.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
